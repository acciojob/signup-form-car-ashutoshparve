<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>


	<form  method="post">
        <label for="name">Name</label>
        <input type="text" name="Name" id="name" placeholder="Name" required>
        <br><br>


        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Email" required>
        <br><br>


        <fieldset >
            <legend>Gender</legend>
            <label for="gender_m" >Male</label>
            <input type="radio" name="gender" id="gender_m" value="male" required>
            <label for="gender_f">Female</label>
            <input type="radio" id="gender_f" name="gender" value="female" required>
        </fieldset>


        <label for="cars" >Car brands</label>
        <select name="car brands" id="cars" required>
            <option value="" disabled selected>--Please choose an option--</option>
            <option value="bmw">BMW</option>
            <option value="audi">Audi</option>
            <option value="benz">BENZ</option>
        </select>
        <br><br>

        <label for="age">Age</label>
        <input type="number" name="age" id="age" placeholder="Age" required>
        <br><br>

        <label for="dob">DOB</label>
        <input type="date" name="dob" id="dob" required>
        <br><br>

        <label for="tel">Phone Number</label>
        <input type="Tel" name="Phone Number" id="tel" placeholder="xxx-xxx-xxxx">
        <br><br>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Password" required>
        <br><br>


        <label for="tos">I agree to the TOS</label>
        <input type="checkbox" name="tos" id="tos" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>

</body>

</html>
