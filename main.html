<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>


	<form  method="post">
        <label for="name">Name</label>
        <input type="text" name="" id="name" placeholder="Name" required>
        <br><br>


        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Email" required>
        <br><br>


        <fieldset >
            <legend>Gender</legend>
            <label for="gender_m" >Male</label>
            <input type="radio" name="gender" id="gender_m" required>
            <label for="gender_f">Female</label>
            <input type="radio" id="gender-f" name="gender" required>
        </fieldset>


        <label for="cars" >Car brands</label>
        <select name="" id="cars" required>
            <option value="" disabled selected>--Please choose an option--</option>
            <option value="bmw">BMW</option>
            <option value="audi">Audi</option>
            <option value="benz">BENZ</option>
        </select>
        <br><br>

        <label for="age">Age</label>
        <input type="number" name="NUMBER" id="age" placeholder="Age" required>
        <br><br>

        <label for="dob">DOB</label>
        <input type="date" name="dob" id="dob" required>
        <br><br>

        <label for="tel">Phone Number</label>
        <input type="Tel" name="" id="tel" placeholder="xxx-xxx-xxxx">
        <br><br>

        <label for="password">Password</label>
        <input type="password" name="" id="password" required>
        <br><br>


        <label for="tos">I agree to the TOS</label>
        <input type="checkbox" name="" id="tos" required>
        <br><br>

        <button>Submit</button>
    </form>

</body>

</html>
